    - "Director of Accounting"
    - "Accounting Director"
    - "Director of Operations"
    # Manager level
    - "Accounting Manager"
    - "Finance Manager"
    - "Controller Manager"
    # Senior individual contributors
    - "Senior Accountant"
    - "Staff Accountant"
    - "Senior Financial Analyst"
